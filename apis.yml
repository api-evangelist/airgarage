name: AirGarage
description: >-
  AirGarage is a full-service parking management platform that helps property
  owners operate their parking lots and garages as revenue-generating real
  estate assets. The company combines proprietary data, full-service operations,
  and proactive pricing strategy: license plate recognition and aerial cameras
  capture real-time occupancy and compliance data, dynamic pricing automatically
  adjusts rates based on demand, aggregator marketing lists spaces across
  channels, on-the-ground teams handle real-time enforcement, and a managed
  driver-support operation processes mobile payments. Property owners get a
  real-time dashboard with transparency into revenue, occupancy, and market
  trends, on a revenue-share model with no long-term contracts. AirGarage is a
  portfolio company of a16z.
